<!-- Load HTMX so components can process hx-* tags inside the canvas -->

<script>
    // 1. Tell HTMX it is safe to make cross-port requests to our Slim API during sandboxing
    htmx.config.selfRequestsOnly = false;

    // 2. Ensure cookies/auth tokens flow across ports safely
    htmx.config.withCredentials = true;
</script>
